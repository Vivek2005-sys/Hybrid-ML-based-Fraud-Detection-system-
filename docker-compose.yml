version: '3.9'

services:
  db:
    image: postgres:15
    container_name: fraud_postgres
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: fraud_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fraud_fastapi
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data: