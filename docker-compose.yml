version: '3.9'

services:
  db:
    image: postgres:15
    container_name: fraud_postgres
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: fraud_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fraud_fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./ml_features:/app/ml_features
    env_file:
      - app/.env
    depends_on:
      db:
        condition: service_healthy
    restart: always
  dashboard:
    build: .
    container_name: fraud_dashboard
    command: streamlit run UI/main.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./ml_features:/app/ml_features
    environment:
      - DATABASE_URL=postgresql://fraud_user:securepassword@db:5432/fraud_db
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: always

volumes:
  postgres_data: